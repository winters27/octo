name: Docker Build & Push

# Publishes Octo's three images (Octo, the yt-dlp shim, octo-sonic) for amd64 and arm64:
# on every push to main (tagged main and the commit), and on every release tag (tagged with
# the release, and latest for a dated release). A release tag on a commit main already built
# reuses main's images: it only adds its own tags to them, without checking or building again. Octo is the Rust server (Dockerfile; the C#
# app in octo/ is in no image). Installs pull all three at their own release's tag, and the
# update helper pulls them on Update now, so they must be on ghcr.io before anyone can see
# the release.
#
# Octo's update check reads GitHub releases, not tags. So, to cut a release:
#   1. Make the release on GitHub as a draft (gh release create <tag> --draft ...). A draft
#      is invisible to the update check.
#   2. Push the tag. This workflow builds and publishes every image of it.
#   3. Once all of them are published, the release job below publishes the draft and marks
#      it Latest. If there was no draft, it publishes nothing and says so; publish the
#      release by hand then, after this workflow is green. It also refuses while any image
#      cannot be pulled without signing in: a new package on ghcr.io starts private, so the
#      first time, make it public on GitHub and re-run the release job.
# Never publish the release before this workflow is green: an install that updates first
# would find no images for it (it then builds them from source, Octo's Rust included, which
# takes many minutes and gigabytes of memory, or fails without ghcr.io).

on:
  workflow_dispatch:
  push:
    # Dated releases (2026.07.29) as well as any future v-prefixed ones. Without the
    # second pattern a dated tag pushes silently and never builds an image.
    tags: ['v*', '[0-9][0-9][0-9][0-9].*']
    branches: [main]
  # No pull_request trigger. A merge already arrives here as a push to main, so
  # building on `closed` too meant every merge built the same commit twice.

# Serialise image builds across the whole repo. Concurrent runs export to the same
# GitHub Actions cache and collide with "failed to reserve cache".
#
# The group is a fixed name because keying it on github.ref never serialised anything
# that mattered: a push to main and a release tag are different refs, so they landed in
# different groups and ran side by side, and that is precisely the pair that overlaps
# when cutting a release. Three releases got away with it before this was noticed.
#
# Queue rather than cancel, because a half published image is worse than a slow one.
# queue:max is what keeps that promise once a third run shows up: the default is to
# cancel whatever is already pending when a newer run arrives, so tagging a release
# would have silently dropped the queued build for the very commit being tagged.
concurrency:
  group: docker
  queue: max
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # The release number is the VERSION file (the Rust build reads it; octo/octo.csproj names
  # the last C# release and is not read once VERSION exists).
  versions:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A dated release must carry its own number in VERSION. Octo reports that number, and
      # the dashboard's update check compares it with the newest tag, so a tag on a commit
      # that was not bumped would leave every updated server offering the same update forever.
      - name: Release tag matches the version
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'v')
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but VERSION says $version. Bump VERSION before tagging."
            exit 1
          fi

      # docker-compose.yml pulls Octo and its sidecars at Octo's own version unless
      # OCTO_IMAGE_TAG says otherwise, so a release bump that missed it would leave
      # installs pulling the last release, Octo included. Checked on main too, so a
      # missed bump shows up before anyone tags it.
      - name: Compose pulls this version's images
        run: |
          version="$(tr -d ' \r\n' < VERSION)"
          stale="$(grep -o 'OCTO_IMAGE_TAG:-[^}]*' docker-compose.yml | sed 's/^OCTO_IMAGE_TAG:-//' | grep -Fvx "$version" | paste -sd ' ' || true)"
          if [ -n "$stale" ]; then
            echo "::error::docker-compose.yml pulls images tagged $stale, but VERSION says $version. Bump the OCTO_IMAGE_TAG defaults with it."
            exit 1
          fi
          for image in octo octo-yt-dlp-shim octo-sonic; do
            if ! grep -Fq "image: ghcr.io/winters27/$image:\${OCTO_IMAGE_TAG:-$version}" docker-compose.yml; then
              echo "::error::docker-compose.yml does not pull ghcr.io/winters27/$image at \${OCTO_IMAGE_TAG:-$version}."
              exit 1
            fi
          done
          # The spotiflac service gets Octo's Mornye image ready from this repository at the
          # release, under a tag of its own: both name the number itself, never OCTO_IMAGE_TAG.
          if ! grep -Fqx "    image: octo-mornye:$version" docker-compose.yml \
            || ! grep -Fqx "      context: \${SPOTIFLAC_BUILD_CONTEXT:-https://github.com/winters27/octo.git#$version:mornye}" docker-compose.yml; then
            echo "::error::docker-compose.yml's spotiflac service does not get Octo's Mornye ready at $version. Bump its image tag and build source with VERSION."
            exit 1
          fi

  # Whether a release tag's commit already has all three images on ghcr.io, both platforms
  # each, under the commit's tag. main's run tags them only after every check and build
  # below passed, so the tag can take them as they are.
  reuse:
    runs-on: ubuntu-latest
    outputs:
      built: ${{ steps.find.outputs.built }}

    steps:
      - name: Login to GitHub Container Registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Look for this commit's images
        id: find
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          built=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            built=true
            for suffix in "" -yt-dlp-shim -sonic; do
              found="$(docker buildx imagetools inspect "$IMAGE$suffix:${GITHUB_SHA::7}" 2>/dev/null || true)"
              for platform in linux/amd64 linux/arm64; do
                grep -q "$platform" <<< "$found" || built=false
              done
            done
          fi
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "::notice::Images of ${GITHUB_SHA::7} already built: $built"

  # Every check in ci.yml (the Rust server, the shim, octo-sonic, the helper and the
  # installer) before anything is published. The C# app's job is left out: no image holds it.
  checks:
    needs: reuse
    if: needs.reuse.outputs.built != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      csharp: false

  # GeoNames' postal codes for the octo image's place data, downloaded once per run so the amd64
  # and arm64 images are built from the same files. The Dockerfile takes them from places-data/
  # in the build context, keyed by their content, so a run on main takes the data as GeoNames
  # has it that day and converts it again only when it changed.
  places:
    needs: reuse
    if: needs.reuse.outputs.built != 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Download GeoNames' postal codes
        run: |
          mkdir -p places-data
          for file in allCountries.zip readme.txt; do
            curl -fsSL --retry 5 --retry-all-errors -o "places-data/$file" "https://download.geonames.org/export/zip/$file"
          done
          unzip -l places-data/allCountries.zip allCountries.txt
          ls -l places-data

      - name: Keep them for the builds
        uses: actions/upload-artifact@v7
        with:
          name: places-data
          path: places-data/*
          if-no-files-found: error
          retention-days: 1

  # Each image for each platform, built on a runner of that platform: arm64 on GitHub's own
  # arm64 runners (free for public repositories) rather than under QEMU, where compiling
  # octo-sonic (Rust and FFmpeg) took many times longer. Each pushes its image by digest
  # only; the merge job below puts the two platforms under the real tags.
  build:
    needs: [versions, checks, places]
    runs-on: ${{ matrix.platform.runner }}

    strategy:
      # One image failing must not cancel another halfway through its push. A failure still
      # stops every tag from moving: merge waits for all of these.
      fail-fast: false
      matrix:
        # Each image is ghcr.io/<owner>/<repo> plus its suffix.
        image:
          # The Rust server (Dockerfile at the top of the repo). Its Rust compile is most of
          # this workflow's time; the cargo-chef layer of third-party crates is cached.
          # Only its build takes the place data, and it fails without it.
          - name: octo
            context: .
            suffix: ""
            places: true
            build_args: PLACES_REQUIRED=1
          - name: yt-dlp-shim
            context: ./yt-dlp-shim
            suffix: -yt-dlp-shim
            places: false
            build_args: ""
          # The Sounds alike reader (Rust).
          - name: octo-sonic
            context: ./sonic
            suffix: -sonic
            places: false
            build_args: ""
        platform:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fetch the place data
        if: matrix.image.places
        uses: actions/download-artifact@v8
        with:
          name: places-data
          path: places-data

      # The shim's Dockerfile downloads yt-dlp by version, "latest" by default. That step's text
      # never changes, so the build cache kept the yt-dlp of whichever build first ran it. Naming
      # the newest release makes a new yt-dlp a new cache key. Without an answer it stays latest.
      - name: Find the newest yt-dlp
        id: ytdlp
        if: matrix.image.name == 'yt-dlp-shim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/yt-dlp/yt-dlp/releases/latest --jq .tag_name 2>/dev/null || true)
          if [[ "$tag" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "Building the shim with yt-dlp $tag"
            echo "arg=YTDLP_VERSION=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No newest yt-dlp release found; the shim builds with latest"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
          # Every image would otherwise be titled after the repo.
          labels: |
            org.opencontainers.image.title=octo${{ matrix.image.suffix }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          platforms: linux/${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ matrix.image.build_args }}
            ${{ steps.ytdlp.outputs.arg }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }},push-by-digest=true,name-canonical=true,push=true
          # A scope per image and platform, so the builds running side by side never fight
          # over the same cache entries.
          cache-from: type=gha,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image.name }}-${{ matrix.platform.arch }}

      - name: Keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          # Platform first, image name last: "digests-*-octo" must not also match octo-sonic.
          name: digests-${{ matrix.platform.arch }}-${{ matrix.image.name }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Puts both platforms of each image under its tags. Runs only once every build above
  # succeeded, so a tag never points at one image of a release and not another.
  merge:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: octo
            suffix: ""
          - name: yt-dlp-shim
            suffix: -yt-dlp-shim
          - name: octo-sonic
            suffix: -sonic

    permissions:
      contents: read
      packages: write

    steps:
      - name: Download the digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*-${{ matrix.image.name }}
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
          # latest is set below, for dated releases only; never guessed from the tag.
          flavor: |
            latest=false
          tags: |
            type=ref,event=branch
            # Tags the image with the release name verbatim, e.g. 2026.07.29. The semver
            # patterns below cannot match a dated tag (07 is not valid semver), so this
            # is what actually labels a release build.
            type=ref,event=tag
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # latest is the newest release, the same thing Update now installs, so an
            # install that pulls latest never runs a main that was not released.
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'v') }}

      - name: Publish the tags for both platforms
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
        run: |
          refs=()
          for digest in *; do refs+=("$IMAGE@sha256:$digest"); done
          if [ "${#refs[@]}" != 2 ]; then
            echo "::error::Expected an amd64 and an arm64 image of $IMAGE, found ${#refs[@]}."
            exit 1
          fi
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "${refs[@]}"

      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # A release tag on a commit main already built: the same images, under the release's tags.
  retag:
    needs: [versions, reuse]
    if: needs.reuse.outputs.built == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        image:
          - name: octo
            suffix: ""
          - name: yt-dlp-shim
            suffix: -yt-dlp-shim
          - name: octo-sonic
            suffix: -sonic

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
          # The same tags merge gives a release.
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && !startsWith(github.ref_name, 'v') }}

      - name: Tag this commit's images for the release
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
        run: |
          mapfile -t tags < <(jq -r '.tags[] | "-t", .' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:${GITHUB_SHA::7}"

      - name: Inspect
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.image.suffix }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: docker buildx imagetools inspect "$IMAGE:$VERSION"

  # Publishes the release's draft once all three images of the tag are on ghcr.io (see the
  # order at the top). Only for dated releases, the ones Octo's update check offers.
  release:
    needs: [merge, retag]
    if: >-
      always() && github.ref_type == 'tag' && !startsWith(github.ref_name, 'v')
      && (needs.merge.result == 'success' || needs.retag.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      published: ${{ steps.publish.outputs.published }}

    steps:
      # Installs pull without signing in, and a new package on ghcr.io starts private. One
      # that is still private would fail every update to this release, so the release waits.
      - name: Every image can be pulled without signing in
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ github.ref_name }}
        run: |
          private=()
          for suffix in "" -yt-dlp-shim -sonic; do
            docker manifest inspect "$IMAGE$suffix:$TAG" > /dev/null 2>&1 || private+=("$IMAGE$suffix")
          done
          if [ "${#private[@]}" -gt 0 ]; then
            echo "::error::Not public yet: ${private[*]}. Make each package public (the package's settings on GitHub, Change visibility), then re-run this job."
            exit 1
          fi

      - name: Publish the draft release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          published=false
          if ! [[ "$TAG" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(\.[0-9]{1,4})?$ ]]; then
            echo "::notice::$TAG is not a dated release, so no release is published."
          else
            # The tag endpoint never returns a draft, so look through the list; drafts come first.
            found="$(gh api "repos/$GH_REPO/releases?per_page=100" \
              --jq "[.[] | select(.tag_name == \"$TAG\")][0] // empty | \"\(.id) \(.draft)\"")"
            read -r id draft <<< "$found"
            if [ -z "$id" ]; then
              echo "::warning::The images for $TAG are on ghcr.io, but there is no release for it. Publish it now; a draft made before the tag is published here by itself."
            elif [ "$draft" = true ]; then
              gh api -X PATCH "repos/$GH_REPO/releases/$id" -F draft=false -f make_latest=true > /dev/null
              published=true
              echo "::notice::Published the release $TAG, now that its images are on ghcr.io."
            else
              echo "::notice::The release $TAG was already published."
            fi
          fi
          echo "published=$published" >> "$GITHUB_OUTPUT"

  # A release published with this workflow's own token starts no other workflow, so the app
  # links that release-links.yml adds on "published" are added from here.
  links:
    needs: release
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-links.yml
