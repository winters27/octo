name: Docker Build & Push

on:
  workflow_dispatch:
  push:
    # Dated releases (2026.07.29) as well as any future v-prefixed ones. Without the
    # second pattern a dated tag pushes silently and never builds an image.
    tags: ['v*', '[0-9][0-9][0-9][0-9].*']
    branches: [main]
  # No pull_request trigger. A merge already arrives here as a push to main, so
  # building on `closed` too meant every merge built the same commit twice.

# Serialise image builds across the whole repo. Concurrent runs export to the same
# GitHub Actions cache and collide with "failed to reserve cache".
#
# The group is a fixed name because keying it on github.ref never serialised anything
# that mattered: a push to main and a release tag are different refs, so they landed in
# different groups and ran side by side, and that is precisely the pair that overlaps
# when cutting a release. Three releases got away with it before this was noticed.
#
# Queue rather than cancel, because a half published image is worse than a slow one.
# queue:max is what keeps that promise once a third run shows up: the default is to
# cancel whatever is already pending when a newer run arrives, so tagging a release
# would have silently dropped the queued build for the very commit being tagged.
concurrency:
  group: docker
  queue: max
  cancel-in-progress: false

env:
  DOTNET_VERSION: "9.0.x"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # A dated release must carry its own number in octo.csproj. Octo reports that
      # number, and the dashboard's update check compares it with the newest tag, so a
      # tag on a commit that was not bumped would leave every updated server offering
      # the same update forever.
      - name: Release tag matches the version
        if: startsWith(github.ref, 'refs/tags/') && !startsWith(github.ref_name, 'v')
        run: |
          version="$(sed -n 's:.*<InformationalVersion>\(.*\)</InformationalVersion>.*:\1:p' octo/octo.csproj | head -n 1)"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME, but octo/octo.csproj says $version. Bump InformationalVersion before tagging."
            exit 1
          fi

      # docker-compose.yml pulls the sidecar images at Octo's own version unless
      # OCTO_IMAGE_TAG says otherwise, so a release bump that missed it would leave
      # installs pulling the last release's sidecars. Checked on main too, so a
      # missed bump shows up before anyone tags it.
      - name: Compose pulls this version's images
        run: |
          version="$(sed -n 's:.*<InformationalVersion>\(.*\)</InformationalVersion>.*:\1:p' octo/octo.csproj | head -n 1)"
          stale="$(grep -o 'OCTO_IMAGE_TAG:-[^}]*' docker-compose.yml | sed 's/^OCTO_IMAGE_TAG:-//' | grep -Fvx "$version" | paste -sd ' ' || true)"
          if [ -n "$stale" ]; then
            echo "::error::docker-compose.yml pulls images tagged $stale, but octo/octo.csproj says $version. Bump the OCTO_IMAGE_TAG defaults with it."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # ffmpeg for the Radio transcoder; Noto CJK and Symbola, as in the
      # image, so the cover tests can draw names in other scripts.
      - name: Install Radio transcoder and cover fonts
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk fonts-symbola

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

  docker:
    needs: build-and-test
    runs-on: ubuntu-latest
    # No `if` needed: the only triggers left are push and workflow_dispatch, both of
    # which should publish. The old condition also allowed merged pull_request events,
    # which no longer reach this workflow.

    # One job per image Octo publishes, all with the same tags and platforms, so a
    # release's sidecars carry the release's number and docker-compose.yml can pull
    # them. Each image is ghcr.io/<owner>/<repo> plus its suffix.
    strategy:
      # One image failing must not cancel another halfway through its push.
      fail-fast: false
      matrix:
        include:
          - name: octo
            context: .
            suffix: ""
            # The scope this image has always cached under (build-push-action's
            # default), so splitting into a matrix keeps its cache.
            cache: buildkit
          - name: yt-dlp-shim
            context: ./yt-dlp-shim
            suffix: -yt-dlp-shim
            cache: yt-dlp-shim
          # The Sounds alike reader (Rust). Skipped by the first step below until
          # sonic/ is in the repo, so it needs no edit here when it lands; its
          # service in docker-compose.yml then wants the same image: line the shim
          # has. A Rust build for arm64 runs under QEMU and is slow.
          - name: octo-sonic
            context: ./sonic
            suffix: -octo-sonic
            cache: octo-sonic

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # An image whose folder is not in this commit is skipped, and the job passes.
      - name: Is ${{ matrix.name }} in this commit
        id: present
        env:
          CONTEXT: ${{ matrix.context }}
        run: |
          if [ -f "$CONTEXT/Dockerfile" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$CONTEXT/Dockerfile is not in this commit, so ${{ matrix.name }} is not built."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.present.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.present.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: steps.present.outputs.build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.present.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}${{ matrix.suffix }}
          tags: |
            type=ref,event=branch
            # Tags the image with the release name verbatim, e.g. 2026.07.29. The semver
            # patterns below cannot match a dated tag (07 is not valid semver), so this
            # is what actually labels a release build.
            type=ref,event=tag
            type=sha,prefix=
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Was gated on refs/heads/dev, a branch this repo does not have, so `latest`
            # was never published at all and `docker pull ...:latest` failed for everyone.
            type=raw,value=latest,enable={{is_default_branch}}
          # Every image would otherwise be titled after the repo.
          labels: |
            org.opencontainers.image.title=octo${{ matrix.suffix }}

      - name: Build and push
        if: steps.present.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # A scope per image, so the images building side by side never fight
          # over the same cache entries.
          cache-from: type=gha,scope=${{ matrix.cache }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cache }}
