name: Release app links

# The app releases (android-v*, desktop-v*) are published here but never as
# Latest, so only the server shows on the front page. After any release is
# published, server or app, this links the newest app releases at the end of
# the Latest release's notes (.github/scripts/app_links.py).
#
# The app releases are published with a personal token, so they do start this
# workflow; its own edits use GITHUB_TOKEN and start nothing, so it cannot loop.
on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: release-links
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Link the newest apps from the Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 .github/scripts/app_links.py
