name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Superseded PR pushes are pointless to finish, so cancel those. Never cancel on
# main: a run there is the record of whether that commit is good.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_VERSION: "9.0.x"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Radio transcoder
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal
        env:
          # The WebApplicationFactory tests boot the real Program, and on this
          # runner that first host build has ranged from 1m32s to over 5m
          # across runs of the same commit's code (2m08s on the PR run, timeout
          # on the merge run, 1m32s on the release run). The resolver kills the
          # build at 5m by default, which turned that variance into a flaky
          # red on main. Locally the same build takes about a second, so this
          # only widens the CI cliff; a genuine hang still fails the job.
          DOTNET_HOST_FACTORY_RESOLVER_DEFAULT_TIMEOUT_IN_SECONDS: "600"

  # The shim is Python and its image is only ever built on the deploy host, so
  # before this job a syntax error in app.py passed CI and was discovered when
  # the container failed to restart in production. compileall alone justifies
  # the two minutes; the gate tests cover the concurrency logic that decides
  # whether a play queues behind background prewarm.
  shim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python -m compileall -q yt-dlp-shim

      - name: Install test dependencies
        run: pip install -r yt-dlp-shim/requirements-dev.txt

      - name: Gate tests
        run: pytest yt-dlp-shim/tests -q
